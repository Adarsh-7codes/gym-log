{% extends "base.html" %}
{% block title %}Registration closed · Gym Log{% endblock %}
{% block content %}
<div class="authcard">
  <div class="brand" style="text-align:center;font-size:22px;margin-bottom:8px">Gym<span style="color:var(--accent)">Log</span></div>
  <div class="panel">
    <h1>Registration is closed</h1>
    <p class="subtitle" style="text-align:center">
      Accounts are created by your trainer. Ask them to add you, then log in with the
      email and password they give you.
    </p>
    <a class="btn" href="/login" style="display:block;text-align:center">Go to log in</a>
  </div>
</div>
{% endblock %}
